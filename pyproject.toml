[project]
name = "MedicalMultitaskModeling"
version = "1.6.0"
description = "Multitask learning for medical data"
authors = [
    { name = "Raphael Schäfer", email = "jan.raphael.schaefer@mevis.fraunhofer.de" },
    { name = "Till Nicke", email = "till.nicke@mevis.fraunhofer.de" },
]
requires-python = ">=3.10"
readme = "README.md"
license = { file = "license.md" }
dependencies = [
    "torch>=2.1.2,<3",
    "torchvision",
    "scikit-learn>=1.3.1,<2",
    "tqdm>=4.66.1,<5",
    "imageio>=2.31.5,<3",
    "pandas>=2.1.1,<3",
    "monai>=1.3.0,<2",
    "deepdiff>=6.6.1,<7",
    "torchinfo>=1.8.0,<2",
    "json5>=0.9.14,<0.10",
    "minio>=7.1.17,<8",
    "einops>=0.8.0,<0.9",
    "timm>=1.0.15,<2",
    "nibabel>=5.2.1,<6",
    "typer>=0.9.0",
    "toml>=0.10.2,<0.11",
    "segmentation-models-pytorch>=0.5.0,<0.6",
    "wandb>=0.23.0",
    "albumentations>=2.0.0",
    "logfire[fastapi,celery]>=4.13.2",
    "redis"
]

[project.optional-dependencies]
api = [
    "fastapi[standard]",
    "aiohttp>=3.9.0,<4",
    "label-studio-sdk",
    "celery[redis, msgpack]>=5.5.3,<6",
]
detection = ["mmdet>=3.3.0,<4"]
survival = ["lifelines>=0.30.0,<0.31"]
interactive = [
    "plotly",
    "ipywidgets",
    "ipykernel",
    "matplotlib",
    "seaborn",
    "streamlit>=1.51.0",
    "nbformat",
    "nbconvert",
    "black[jupyter]==23.12.1",
]
testing = [
    "pytest",
    "pytest-cov",
]
export = [
    "onnx",
    # "onnxruntime",
    "onnxscript"
]

[project.urls]
Repository = "https://github.com/FraunhoferMEVIS/MedicalMultitaskModeling"
Issues = "https://github.com/FraunhoferMEVIS/MedicalMultitaskModeling/issues"

[project.scripts]
m3 = "mmm.app:app"

[dependency-groups]
deploy = [
    "build>=0.10.0,<0.11",
    "twine>=4.0.2,<5",
]

[[tool.uv.index]]
name = "PyPI"
url = "https://pypi.org/simple/"
default = true

[tool.hatch.build.targets.sdist]
include = [
    "mmm",
    "**/*.jinja2",
]

[tool.hatch.build.targets.wheel]
include = [
    "mmm",
    "**/*.jinja2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
